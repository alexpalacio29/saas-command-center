<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="128" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4"/>
  <!-- Target Grid circles -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#4f46e5" stroke-width="3" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#6366f1" stroke-width="4" opacity="0.6"/>
  
  <!-- Central Command Core -->
  <circle cx="256" cy="256" r="44" fill="url(#accentGrad)"/>
  
  <!-- Orbiting Nodes representing SaaS Products -->
  <circle cx="256" cy="96" r="22" fill="#10b981"/>
  <circle cx="416" cy="256" r="20" fill="#3b82f6"/>
  <circle cx="370" cy="370" r="18" fill="#f59e0b"/>
  <circle cx="142" cy="370" r="20" fill="#a855f7"/>
  <circle cx="96" cy="256" r="18" fill="#06b6d4"/>
  
  <!-- Connecting Crosshairs -->
  <line x1="256" y1="56" x2="256" y2="456" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6" opacity="0.35"/>
  <line x1="56" y1="256" x2="456" y2="256" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6" opacity="0.35"/>
  <polygon points="256,180 322,256 256,332 190,256" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
</svg>
